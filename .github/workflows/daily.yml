name: Daily update

# Runs by itself every day after the US market close (and whenever you press "Run workflow" or push to main):
#   collect fresh data  ->  rebuild the public website  ->  publish it (branch "site" for Vercel/any host; GitHub Pages if USE_PAGES=true).
# Nothing here needs your computer.  The database is kept between runs in a tiny "data" branch (single commit, force-pushed).

on:
  schedule:
    - cron: '45 21 * * *'       # 21:45 UTC = 5:45 pm New York (summer) / 4:45 pm (winter)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write                # save the database to the "data" branch
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install database, PHP and Python packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mariadb-server php-cli php-mysql python3-pymysql
          sudo systemctl start mariadb

      - name: Restore yesterday's data (branch "data")
        id: restore
        run: |
          git fetch origin data:refs/remotes/origin/data --depth=1 || true
          if git cat-file -e origin/data:mstr_terminal.sql.gz 2>/dev/null; then
            git show origin/data:mstr_terminal.sql.gz > /tmp/db.sql.gz
            echo "found=1" >> "$GITHUB_OUTPUT"
          else
            echo "found=0" >> "$GITHUB_OUTPUT"
            echo "No previous data found: this run downloads the full history (takes longer)."
          fi

      - name: Create database and settings
        run: |
          PASS=$(openssl rand -hex 12)
          sudo mysql -e "CREATE DATABASE mstr_terminal CHARACTER SET utf8mb4; CREATE USER 'mstr'@'localhost' IDENTIFIED BY '$PASS'; CREATE USER 'mstr'@'127.0.0.1' IDENTIFIED BY '$PASS'; GRANT ALL ON mstr_terminal.* TO 'mstr'@'localhost'; GRANT ALL ON mstr_terminal.* TO 'mstr'@'127.0.0.1'; FLUSH PRIVILEGES;"
          cat > collector/config.local.json <<JSON
          {"db": {"host": "127.0.0.1", "port": 3306, "user": "mstr", "password": "$PASS", "name": "mstr_terminal"},
           "python": "/usr/bin/python3",
           "sec_user_agent": "BitcoinProxyTrader/1.0 (+https://github.com/${{ github.repository }}) noreply@users.noreply.github.com"}
          JSON
          if [ -f /tmp/db.sql.gz ]; then zcat /tmp/db.sql.gz | sudo mysql mstr_terminal; echo "previous data loaded"; fi

      - name: Collect fresh data
        run: |
          mkdir -p collector/logs
          if [ "${{ steps.restore.outputs.found }}" = "1" ]; then
            python3 -I collector/run_all.py
          else
            python3 -I collector/run_all.py --full
          fi

      - name: Report data freshness
        run: |
          sudo mysql -e "SELECT job, status, LEFT(message,70) AS result FROM mstr_terminal.refresh_log ORDER BY id DESC LIMIT 14"
          LAST=$(sudo mysql -N -e "SELECT MAX(d) FROM mstr_terminal.prices_daily WHERE symbol='MSTR'")
          echo "Latest MSTR price date: $LAST"
          AGE=$(( ( $(date +%s) - $(date -d "$LAST" +%s) ) / 86400 ))
          if [ "$AGE" -gt 5 ]; then echo "::warning::MSTR data is $AGE days old - Yahoo may be blocking this runner. The site still publishes with the last good data."; fi

      - name: Save the database for tomorrow (branch "data")
        run: |
          mkdir /tmp/dump
          sudo mysqldump --single-transaction --default-character-set=utf8mb4 mstr_terminal | gzip -9 > /tmp/dump/mstr_terminal.sql.gz
          cd /tmp/dump
          git init -q -b data
          git config user.name "BitcoinProxyTrader bot"
          git config user.email "noreply@users.noreply.github.com"
          git add mstr_terminal.sql.gz
          git commit -qm "database $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data

      - name: Build the website
        env:
          MSTR_API: http://127.0.0.1:8080/api/index.php
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/php.log 2>&1 &
          sleep 3
          SITE_URL="${{ vars.SITE_URL }}"
          if [ -z "$SITE_URL" ] && [ "${{ vars.USE_PAGES }}" = "true" ]; then
            SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          fi
          if [ -n "$SITE_URL" ]; then python3 -I deploy/export_static.py --site-url "$SITE_URL"; else python3 -I deploy/export_static.py; fi
          touch site/.nojekyll

      - name: Publish the site files on branch "site" (Vercel / any static host picks this up)
        run: |
          cd site
          git init -q -b site
          git config user.name "BitcoinProxyTrader bot"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          git commit -qm "site $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site:site

      - name: Upload website for GitHub Pages
        if: vars.USE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: update
    if: vars.USE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
